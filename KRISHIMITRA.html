    .hero{position:relative;overflow:hidden;border-radius:32px;box-shadow:0 25px 50px rgba(0,0,0,0.3);margin-bottom:3rem;}

    .form-card{background:rgba(255,255,255,0.08);backdrop-filter:blur(25px);border-radius:32px;padding:3rem;}
    .input-group{display:flex;flex-direction:column;margin-bottom:1rem;}
    .input-group label{font-size:0.9rem;font-weight:500;color:#4ecdc4;margin-bottom:0.5rem;}
    .input-group input,.input-group select{padding:1rem 1.5rem;border-radius:16px;background:rgba(0,0,0,0.8);border:1px solid rgba(255,255,255,0.2);color:#fff;}
    .btn-premium{background:linear-gradient(45deg,#667eea,#764ba2,#f093fb,#f5576c);color:white;font-weight:600;padding:1.5rem 3rem;border-radius:50px;}

  <div class="max-w-6xl mx-auto">

        <div class="text-center">

        </div>
      </div>
    </div>

    <!-- Location Weather -->
    <div id="locationWeather" class="mb-6 text-center text-green-400 font-semibold text-lg">
      Detecting location and weather...
    </div>

    <!-- Form -->
    <form id="soilForm" class="form-card max-w-4xl mx-auto">
      <h2 class="text-3xl md:text-4xl font-semibold mb-8 text-center text-white">Soil Analysis Input</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="input-group">
          <label for="nitrogen">Nitrogen (N) %</label>
          <input type="number" id="nitrogen" min="0" max="10" step="0.01" required />
        </div>
        <div class="input-group">
          <label for="phosphorus">Phosphorus (P) %</label>
          <input type="number" id="phosphorus" min="0" max="5" step="0.01" required />
        </div>
        <div class="input-group">
          <label for="potassium">Potassium (K) %</label>
          <input type="number" id="potassium" min="0" max="10" step="0.01" required />
        </div>
        <div class="input-group">
          <label for="ph">pH Level (4.0 - 9.0)</label>
          <input type="number" id="ph" min="4" max="9" step="0.1" required />
        </div>
        <div class="input-group">
          <label for="soilType">Soil Type</label>
          <select id="soilType" required>
            <option value="">Select Soil Type</option>
            <option value="sandy">Sandy</option>
            <option value="loamy">Loamy</option>
            <option value="clay">Clay</option>
            <option value="silty">Silty</option>
          </select>
        </div>
        <div class="input-group">
          <label for="season">Season</label>
          <select id="season" required>
            <option value="">Select Season</option>
            <option value="kharif">Kharif</option>
            <option value="rabi">Rabi</option>
            <option value="zaid">Zaid</option>
          </select>
        </div>
      </div>
      <div class="text-center mt-8">
        <button type="submit" class="btn-premium">Analyze & Recommend</button>
      </div>
    </form>

      <div id="resultsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>
  </div>

    function calculateUPYOGSHALI(crop, params){
      let score=0;
      if(params.ph>=crop.idealPh[0] && params.ph<=crop.idealPh[1]) score+=25;
      if(params.n>=crop.idealN[0] && params.n<=crop.idealN[1]) score+=25;
      if(params.p>=crop.idealP[0] && params.p<=crop.idealP[1]) score+=25;
      if(params.k>=crop.idealK[0] && params.k<=crop.idealK[1]) score+=15;
      if(crop.soil.includes(params.soilType)) score+=10;
      return score;
    }

   async function detectLocationWeather() {
      const locationElem = document.getElementById("locationWeather");
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(async (position) => {
          const { latitude, longitude } = position.coords;
          // Fetch weather using OpenWeatherMap API (replace YOUR_API_KEY with actual key)
          try {
            const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${latitude}&lon=${longitude}&units=metric&appid=YOUR_API_KEY`);
            const data = await response.json();
            const weather = `${data.name}: ${data.weather[0].description}, ${data.main.temp}°C`;
            locationElem.textContent = weather;
          } catch {
            locationElem.textContent = `Location: ${latitude.toFixed(2)}, ${longitude.toFixed(2)}`;
          }
        }, () => { locationElem.textContent = "Unable to detect location"; });
      } else {
        locationElem.textContent = "Geolocation not supported";
      }
    }
    detectLocationWeather();

    document.getElementById("soilForm").addEventListener("submit",(e)=>{
      e.preventDefault();
      const params={
        n:parseFloat(document.getElementById("nitrogen").value),
        p:parseFloat(document.getElementById("phosphorus").value),
        k:parseFloat(document.getElementById("potassium").value),
        ph:parseFloat(document.getElementById("ph").value),
        soilType:document.getElementById("soilType").value,
        season:document.getElementById("season").value
      };
      const resultsList=document.getElementById("resultsList");
      resultsList.innerHTML="";
      crops.forEach(crop=>{
        const score=calculateUPYOGSHALI(crop,params);
        if(score>=50){
          const card=document.createElement("div");
          card.className="result-card";
          card.innerHTML=`<h4 class="text-xl font-semibold mb-2">${crop.name}</h4>
            <p>UPYOGSHALI: ${score}%</p>
            <p>KHAADH: ${crop.fertilizer}</p>
            <p>UTPADAN: ${crop.yield}</p>`;
          resultsList.appendChild(card);
        }
      });
      document.getElementById("result").style.opacity=1;
    });
